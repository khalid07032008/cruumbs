00 11px 'DM Sans',sans-serif;cursor:pointer}.arrival-bottom button:focus-visible{outline:3px solid #fff8ea;outline-offset:4px}#rooftop-arrival.arrival-leaving{transform:translateY(-100%);opacity:.7;pointer-events:none}#replay-arrival{font:700 11px 'DM Sans',sans-serif;border:0;border-bottom:1px solid currentColor;background:none;color:inherit;cursor:pointer;padding:5px}#replay-arrival[hidden]{display:none}@keyframes flyover{0%{transform:translate(-35vw,8vh) rotate(-8deg)}35%{transform:translate(28vw,-4vh) rotate(-4deg)}65%{transform:translate(65vw,1vh) rotate(4deg)}100%{transform:translate(120vw,-13vh) rotate(-12deg)}}@keyframes wingbeat{from{transform:rotate(-14deg) scaleY(1)}to{transform:rotate(35deg) scaleY(.24)}}@keyframes arrival-title{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@keyframes roof-rise{from{transform:translateY(35px)}to{transform:translateY(0)}}@media(max-width:600px){.arrival-heading{top:34%}.arrival-heading>span{font-size:8px;letter-spacing:2px}.arrival-heading p{font-size:12px}.arrival-bird{top:25%;width:155px}.bird-two{top:17%;width:105px}.bird-three{top:56%;width:125px}.bird-four{top:12%;width:75px}.arrival-roof{height:19%}.roof-chimney{right:13%;height:65px;width:55px}.roof-sign{font-size:8px;left:10%;top:30px}.arrival-bottom>span{display:none}.arrival-bottom{justify-content:flex-end}.arrival-heading h2{letter-spacing:-2px}}@media(prefers-reduced-motion:reduce){#rooftop-arrival{display:none!important}}\n\n.rooftop-sound-toggle{position:fixed;right:18px;bottom:18px;z-index:9000;border:2px solid #202d3a;border-radius:30px;background:#fff8ea;color:#202d3a;box-shadow:3px 3px 0 #202d3a;padding:12px 17px;font:700 11px \"DM Sans\",sans-serif;cursor:pointer}.rooftop-sound-toggle[aria-pressed=true]{background:#efbc50}.arrival-bottom [data-rooftop-sound]{margin-left:auto;background:#fff8ea;color:#202d3a}.arrival-bottom [data-rooftop-sound][aria-pressed=true]{background:#efbc50}@media(max-width:600px){.arrival-bottom{gap:8px}.arrival-bottom button{font-size:9px;padding:11px 13px}.rooftop-sound-toggle{bottom:12px;right:12px;font-size:10px}}\n</style></head>\n<body><div class=\"announcement\">1,111 PIGEONS <span>\u2726</span> ZERO MANNERS <span>\u2726</span> FREE MINT</div><header><a class=\"logo\" href=\"#\" aria-label=\"CRUMBS home\">CRUMBS<span>\u00ae</span></a><nav aria-label=\"Main navigation\"><a href=\"#story\">Our story</a><a href=\"#flock\">The flock</a><a href=\"#mint\">The mint</a><a href=\"#whitelist\" onclick=\"parent.go('wl');return false\">Whitelist</a></nav><a class=\"button small\" href=\"https://x.com/CRUMBS_RH\" target=\"_blank\" rel=\"noopener\">JOIN THE FLOCK \u2197</a></header>\n<main><section class=\"hero\"><div class=\"hero-copy\"><span class=\"eyebrow\">WELCOME TO THE ROOFTOP</span><h1>YOUR BREAKFAST.<br><em>OUR BUSINESS.</em></h1><p>1,111 pigeons. Zero manners.<br>A little rooftop chaos. A lot of missing croissants.</p><div class=\"hero-actions\"><a class=\"button\" href=\"#whitelist\" onclick=\"parent.go('wl');return false\">JOIN THE WHITELIST <span>\u2197</span></a><a class=\"text-link\" href=\"#flock\">Meet the usual suspects \u2193</a></div><span class=\"handnote\">Hide your croissants.</span></div><div class=\"scene\"><img data-asset=\"assets/rooftop.png\" alt=\"Four CRUMBS pigeons on a rooftop, one sneaking a croissant\" fetchpriority=\"high\"><div class=\"scene-stamp\">NO CRUMBS<br>LEFT BEHIND.</div></div></section>\n<div class=\"ticker\" aria-hidden=\"true\"><span>SMALL BIRDS. BIG ATTITUDE.</span><b>\u2726</b><span>THE ROOFTOPS BELONG TO US.</span><b>\u2726</b><span>SMALL BIRDS. BIG ATTITUDE.</span></div>\n<section id=\"story\" class=\"story wrap\"><div><span class=\"eyebrow\">01 / THE NEIGHBOURHOOD</span><h2>GOOD COMPANY.<br>BAD TABLE MANNERS.</h2></div><div class=\"story-copy\"><p class=\"lead\">You left a croissant unattended.<br>We started a community around it.</p><p>CRUMBS is a flock of 1,111 rooftop locals with nowhere important to be. Some read the paper. Some bring the coffee. One definitely took your breakfast.</p><p>Pick your pigeon. Find your people. Keep an eye on your plate.</p><span class=\"scribble\">Nobody saw a thing. \u2197</span></div></section>\n<section id=\"flock\" class=\"flock\"><div class=\"wrap\"><div class=\"section-top\"><div><span class=\"eyebrow\">02 / THE USUAL SUSPECTS</span><h2>MEET THE FLOCK.</h2></div><p>Different outfits.<br>Same questionable intentions.</p></div><div class=\"collection-controls\"><span class=\"collection-count\">111 ROOFTOP LOCALS</span><button id=\"motion-toggle\" type=\"button\" aria-pressed=\"false\">Pause motion \u23f8</button></div><div class=\"collection-stage\" id=\"collection-stage\" aria-label=\"CRUMBS collection preview\"><div class=\"collection-lanes\" id=\"collection-lanes\"></div></div><div class=\"collection-bottom\"><p>111 faces. One very bad influence.</p><button id=\"view-all\" type=\"button\" aria-expanded=\"false\" aria-controls=\"collection-grid\">Explore all 111 \u2197</button></div><div id=\"collection-grid\" class=\"collection-grid\" hidden></div><dialog id=\"portrait-dialog\" aria-labelledby=\"portrait-title\"><button id=\"close-portrait\" aria-label=\"Close portrait\">\u00d7</button><img id=\"large-portrait\" alt=\"\"><div><strong id=\"portrait-title\"></strong><span>THE CRUMBS COLLECTION</span></div></dialog></div></section>\n<section id=\"mint\" class=\"mint wrap\"><div class=\"mint-art\"><img data-asset=\"assets/pigeon.png\" alt=\"CRUMBS pigeon with backward red cap\" loading=\"lazy\"><span class=\"label\">SUSPECT #001</span></div><div class=\"mint-copy\"><span class=\"eyebrow\">03 / A SPOT ON THE ROOF</span><h2>JOIN THE<br>BREAKFAST CLUB.</h2><p>The flock is forming. Follow CRUMBS for mint dates, access details and the next rooftop sighting.</p><div class=\"mint-stats\"><div><strong>1,111</strong><span>TOTAL SUPPLY</span></div><div><strong>FREE</strong><span>MINT PRICE*</span></div></div><div class=\"status\"><span></span>MINT DATE TO BE ANNOUNCED</div><a class=\"button\" href=\"https://x.com/CRUMBS_RH\" target=\"_blank\" rel=\"noopener\">FOLLOW @CRUMBS_RH \u2197</a><p class=\"fine\">*Network fees may apply. Minting is not open yet.</p></div></section>\n<section class=\"faq wrap\" id=\"faq\"><div><span class=\"eyebrow\">04 / BEFORE YOU ASK</span><h2>A FEW<br>BREADCRUMBS.</h2></div><div class=\"questions\"><details open><summary>What is CRUMBS?<span>+</span></summary><p>A collection of 1,111 pigeon characters, brought together by rooftop life, dry humour and a suspicious number of missing croissants.</p></details><details><summary>Is the mint free?<span>+</span></summary><p>Yes. CRUMBS is planned as a free mint. Any applicable network fees are separate.</p></details><details><summary>When can I mint?<span>+</span></summary><p>The date and access details have not been announced. Follow @CRUMBS_RH for official updates.</p></details><details><summary>Where will the official mint link appear?<span>+</span></summary><p>We will share it through @CRUMBS_RH and update this site when the mint is ready. There is no active mint or wallet connection on this page yet.</p></details><details><summary>Who took the croissant?<span>+</span></summary><p>The pigeon in the yellow jacket has requested a lawyer.</p></details></div></section>\n<section class=\"outro\"><span class=\"eyebrow\">THE ROOFTOP IS BETTER WITH COMPANY.</span><h2>COME FOR THE ART.<br>STAY FOR THE CRUMBS.</h2><a class=\"button light\" href=\"https://x.com/CRUMBS_RH\" target=\"_blank\" rel=\"noopener\">FIND US ON X \u2197</a></section></main><footer><a class=\"logo\" href=\"#\">CRUMBS</a><span>1,111 pigeons. Zero manners.</span><a href=\"https://x.com/CRUMBS_RH\" target=\"_blank\" rel=\"noopener\">X / TWITTER \u2197</a><button class=\"rooftop-sound-toggle\" data-rooftop-sound type=\"button\" aria-pressed=\"false\">\u25d6 SOUND READY \u00b7 MUTE</button><button id=\"replay-arrival\" type=\"button\">Replay the flyover \u2197</button><small>\u00a9 2026 CRUMBS</small></footer><script>document.querySelectorAll('[data-asset]').forEach(img=>img.src=parent.CRUMBS_ASSETS[img.dataset.asset]);<\/script><script>(() => {\n \n const Engine=window.AudioContext||window.webkitAudioContext;\n let ctx,master,loading,sources=[],wanted=true,failed=false;\n const buttons=()=>document.querySelectorAll('[data-rooftop-sound]');\n const audible=()=>wanted&&ctx?.state==='running'&&sources.length>0;\n function paint(){buttons().forEach(b=>{b.textContent=failed?'SOUND UNAVAILABLE':audible()?'\u25d6 PIGEONS \u00b7 MUTE':wanted?'\u25d6 SOUND READY \u00b7 MUTE':'\u25d6 PIGEONS \u00b7 UNMUTE';b.setAttribute('aria-pressed',String(wanted));b.setAttribute('aria-label',wanted?'Mute pigeon ambience':'Unmute pigeon ambience');b.title=audible()?'Pigeon ambience is playing':wanted?'Sound starts automatically when your browser allows it, or on your first interaction.':'Pigeon ambience is muted'})}\n function setup(){\n  if(ctx&&ctx.state!=='closed')return;\n  ctx=new Engine();master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination);ctx.onstatechange=paint;failed=false;\n  loading=Promise.all(['dove','pigeon'].map(async name=>{const r=await fetch(parent.CRUMBS_ASSETS['assets/audio/'+name+'.ogg']);if(!r.ok)throw Error('Audio unavailable');return ctx.decodeAudioData(await r.arrayBuffer())})).then(buffers=>{\n   const started=ctx.currentTime+.05;\n   [[0,.36,-.45,1,0],[1,.22,.45,1,2.2],[0,.12,.7,.94,4.1]].forEach(([index,volume,pan,rate,offset])=>{\n    const source=ctx.createBufferSource(),gain=ctx.createGain(),stereo=ctx.createStereoPanner();source.buffer=buffers[index];source.loop=true;source.playbackRate.value=rate;gain.gain.value=volume;stereo.pan.value=pan;source.connect(gain);gain.connect(stereo);stereo.connect(master);source.start(started,offset%source.buffer.duration);sources.push(source);\n   });paint();\n  }).catch(()=>{failed=true;paint()});\n }\n function attempt(){if(!wanted||!Engine)return;setup();master.gain.setTargetAtTime(.5,ctx.currentTime,.15);ctx.resume().then(paint).catch(paint);paint()}\n function mute(){wanted=false;if(ctx)master.gain.setTargetAtTime(0,ctx.currentTime,.05);paint()}\n document.addEventListener('click',e=>{if(e.target.closest('[data-rooftop-sound]')){if(wanted)mute();else{wanted=true;attempt()}}});\n function unlock(e){if(wanted&&ctx?.state!=='running'&&!e.target.closest?.('[data-rooftop-sound]'))attempt()}\n ['pointerdown','touchend','keydown','click'].forEach(type=>document.addEventListener(type,unlock,{passive:true}));\n window.addEventListener('pagehide',()=>{sources.forEach(s=>{try{s.stop()}catch{}});sources=[];ctx?.close().catch(()=>{})});\n window.addEventListener('pageshow',e=>{if(e.persisted){ctx=undefined;attempt()}});\n window.crumbsSound={refresh:paint};paint();attempt();\n})();\n<\/script><script>(() => {\n  const reduced=matchMedia('(prefers-reduced-motion: reduce)');\n  const scene=document.createElement('section');\n  scene.id='rooftop-arrival';scene.hidden=true;scene.setAttribute('role','dialog');scene.setAttribute('aria-modal','true');scene.setAttribute('aria-label','Welcome to the CRUMBS rooftop');\n  const bird=(color,extra='')=>`<svg viewBox=\"0 0 180 130\" aria-hidden=\"true\"><g stroke=\"#202d3a\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path class=\"far-wing\" d=\"M86 75Q57 35 21 23Q22 52 63 91Z\" fill=\"#778a9a\"/><path d=\"M55 87L13 98L39 108L74 99\" fill=\"${color}\"/><path d=\"M59 92C55 65 83 54 108 66C105 41 119 28 136 32C155 36 157 61 148 74C140 101 84 113 59 92Z\" fill=\"${color}\"/><path d=\"M151 51L173 62L151 67Z\" fill=\"#e7a33c\"/><path d=\"M124 45Q139 39 148 49L145 58Q131 66 124 54Z\" fill=\"#fff8ea\"/><path d=\"M125 46L148 49\"/><ellipse cx=\"140\" cy=\"51\" rx=\"2.5\" ry=\"4\" fill=\"#202d3a\" stroke=\"none\"/><path d=\"M86 102L84 113L76 114M99 101L99 111L108 113\" fill=\"none\" stroke=\"#b64f32\"/><path class=\"near-wing\" d=\"M94 79Q71 25 36 17Q26 28 35 40L46 47L38 44Q37 58 66 86Q80 98 94 79Z\" fill=\"${color}\"/>${extra}</g></svg>`;\n  scene.innerHTML=`<div class=\"arrival-grain\"></div><div class=\"arrival-sun\"></div><div class=\"arrival-cloud cloud-one\"></div><div class=\"arrival-cloud cloud-two\"></div><div class=\"arrival-skyline\" aria-hidden=\"true\"><svg viewBox=\"0 0 1440 360\" preserveAspectRatio=\"none\"><path fill=\"#9babb0\" d=\"M0 170H90V130H155V180H220V100H300V163H365V70H438V160H520V135H620V195H730V110H800V175H860V85H920V156H1020V115H1105V190H1220V80H1300V147H1440V360H0Z\"/><path fill=\"#697c88\" d=\"M0 248H110V203H230V261H350V190H490V230H590V170H680V242H820V202H930V257H1060V184H1160V245H1310V195H1440V360H0Z\"/><g stroke=\"#697c88\" stroke-width=\"5\"><path d=\"M396 70V15M371 33H422M389 20L378 8M407 20L418 8M1260 80V20M1235 39H1285\"/></g></svg></div><div class=\"arrival-heading\"><span>THE ROOFTOP IS WAKING UP</span><h2>CRUMBS<span>\u00ae</span></h2><p>1,111 pigeons. Zero manners.</p></div><div class=\"arrival-bird bird-one\">${bird('#a99bbd','<path d=\"M116 35Q130 20 149 34L153 43L117 38Z\" fill=\"#b64f32\"/>')}</div><div class=\"arrival-bird bird-two\">${bird('#869caf')}</div><div class=\"arrival-bird bird-three\">${bird('#c8886d')}</div><div class=\"arrival-bird bird-four\">${bird('#b4a1c4')}</div><div class=\"arrival-roof\" aria-hidden=\"true\"><div class=\"roof-chimney\"></div><div class=\"roof-edge\"></div><div class=\"roof-bricks\"></div><div class=\"roof-sign\">NO CRUMBS LEFT BEHIND.</div></div><div class=\"arrival-bottom\"><span>MAKE ROOM FOR THE FLOCK.</span><button type=\"button\" data-rooftop-sound aria-pressed=\"false\">\u25d6 SOUND READY \u00b7 MUTE</button><button type=\"button\" id=\"skip-arrival\">SKIP INTRO \u2197</button></div>`;\n  document.body.append(scene);window.crumbsSound?.refresh();\n  const skip=scene.querySelector('#skip-arrival');let timer,exitTimer,previousFocus,locked=[];\n  function finish(){clearTimeout(timer);clearTimeout(exitTimer);scene.hidden=true;scene.classList.remove('arrival-run ument.querySelector('#motion-toggle');\n  function updateMotion(){ stage.classList.toggle('motion-paused',paused); toggle.textContent=paused?'Resume motion \u25b6':'Pause motion \u23f8'; toggle.setAttribute('aria-pressed',String(paused)); }\n  toggle.addEventListener('click',()=>{paused=!paused;updateMotion()});\n  reduced.addEventListener('change',event=>{paused=event.matches;updateMotion()});\n  updateMotion();\n  function card(n,duplicate=false){\n    const id=String(n).padStart(3,'0');\n    const button=document.createElement('button');button.type='button';button.className='collection-card';\n    button.setAttribute('aria-label',`View CRUMBS #${id}`);\n    const img=document.createElement('img');img.src=parent.CRUMBS_ASSETS[`assets/collection/${id}.webp`];img.alt=`CRUMBS pigeon portrait ${id}`;img.loading='lazy';img.decoding='async';img.width=180;img.height=180;\n    const caption=document.createElement('span');caption.textContent=`CRUMBS #${id}`;button.append(img,caption);\n    if(duplicate){button.tabIndex=-1;button.setAttribute('aria-hidden','true')}\n    button.addEventListener('click',()=>{const large=document.querySelector('#large-portrait');large.src=img.src;large.alt=img.alt;document.querySelector('#portrait-title').textContent=`CRUMBS #${id}`;dialog.showModal()});\n    return button;\n  }\n  for(let row=0;row<3;row++){\n    const lane=document.createElement('div');lane.className='collection-lane';lane.style.setProperty('--duration',`${190+row*25}s`);\n    for(let repeat=0;repeat<2;repeat++)for(let n=row*37+1;n<=(row+1)*37;n++)lane.append(card(n,repeat===1));\n    lanes.append(lane);\n  }\n  const all=document.querySelector('#view-all');\n  all.addEventListener('click',()=>{if(!grid.children.length)for(let n=1;n<=111;n++)grid.append(card(n));grid.hidden=!grid.hidden;all.setAttribute('aria-expanded',String(!grid.hidden));all.textContent=grid.hidden?'Explore all 111 \u2197':'Close gallery \u2191'});\n  document.querySelector('#close-portrait').addEventList >\n<footer class=\"wl-footer\"><div><a class=\"logo\" href=\"#\" onclick=\"parent.go('home','');return false\">CRUMBS</a><p>1,111 pigeons. Zero manners.<br>\u00a9 2026 CRUMBS \u00b7 <a href=\"https://x.com/CRUMBS_RH\" target=\"_blank\" rel=\"noopener\">@CRUMBS_RH</a></p></div><strong>FREE MINT \u00b7 1,111 CRUMBS</strong></footer><button class=\"rooftop-sound-toggle\" data-rooftop-sound type=\"button\" aria-pressed=\"false\">\u25d6 SOUND READY \u00b7 MUTE</button><script>document.querySelectorAll('[data-asset]').forEach(img=>img.src=parent.CRUMBS_ASSETS[img.dataset.asset]);<\/script><script>window.CRUMBS_CONFIG = {\n  sheetsUrl: \"https://script.google.com/macros/s/AKfycbzVkv8ERPJrU7Ik1hH1HK3aJCJw7U01mLbfW0w3bfd_e3YoF_SlDMHMGZeFEFucP_wZIA/exec\"\n};\n<\/script><script>const form=document.getElementById('wl-form');\nconst steps=[...document.querySelectorAll('.step')];\nlet current=0;let completed=0;let saving=false;\nconst el=id=>document.getElementById(id);\nfunction username(){return el('username').value.trim().replace(/^@/,'');}\nfunction setError(id,message){el(id).textContent=message;}\nfunction draw(){steps.forEach((s,i)=>{s.classList.toggle('active',i===current);s.classList.toggle('complete',i<completed);s.querySelector('.step-body').hidden=i!==current;s.querySelector('.step-state').textContent=i<completed?'\u2713':i===current?'\u2193':'\u00b7';const edit=s.querySelector('.edit-step');if(edit)edit.hidden=i>=completed||saving;});el('level').textContent=completed+'/5';el('wl-progress').value=completed;}\nfunction validUsername(){const ok=/^[A-Za-z0-9_]{1,15}$/.test(username());setError('username-error',ok?'':'Enter a valid X username (1\u201315 letters, numbers or underscores).');return ok;}\nfunction validReply(){let ok=false;try{const u=new URL(el('reply-url').value.trim());const m=u.pathname.match(/^\\/([A-Za-z0-9_]{1,15})\\/status\\/(\\d+)\\/?$/);ok=u.protocol==='https:'&&['x.com','www.x.com','twitter.com','www.twitter.com'].includes(u.hostname)&&!!m&&m[1].toLowerCase()===username().toLowerCase()&&m[2]!=='2105100048220713017';}catch{}setError('reply-error',ok?'':'Paste the link to your own reply, from the same X username as step 2.');return ok;}\nfunction validWallet(){const ok=/^0x[a-fA-F0-9]{40}$/.test(el('wallet').value.trim())&&!/^0x0{40}$/i.test(el('wallet').value.trim());setError('wallet-error',ok?'':'Enter a non-zero EVM address: 0x followed by 40 hexadecimal characters.');return ok;}\nel('follow-confirm').addEventListener('change',()=>{document.querySelector('[data-next=\"0\"]').disabled=!el('follow-confirm').checked;});\nel('like-confirm').addEventListener('change',()=>{document.querySelector('[data-next=\"2\"]').disabled=!el('like-confirm').checked;});\ndocument.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.next);if(i!==current)return;if(i===0&&!el('follow-confirm').checked)return;if(i===1&&!validUsername())return;if(i===2&&!el('like-confirm').checked)return;if(i===3&&!validReply())return;completed=i+1;current=completed;draw();const input=steps[current].querySelector('input:not([type=checkbox]),a');input?.focus({preventScroll:true});steps[current].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});}));\ndocument.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{if(saving)return;current=Number(b.dataset.edit);completed=current;draw();steps[current].querySelector('input').focus();}));\nform.addEventListener('submit',async e=>{e.preventDefault();if(saving||current!==4)return;setError('submit-error','');if(!validUsername()){current=1;completed=1;draw();return;}if(!validReply()){current=3;completed=3;draw();return;}if(!validWallet())return;if(!el('consent').checked){setError('submit-error','Please confirm that you agree to submit these details for review.');return;}saving=true;const button=el('submit-application');button.disabled=true;button.textContent='SAVING YOUR APPLICATION\u2026';try{const endpoint=window.CRUMBS_CONFIG?.sheetsUrl?.trim();if(!endpoint)throw new Error('Registration is not connected yet. No application has been sent.');const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({username:username(),reply_url:el('reply-url').value.trim(),wallet:el('wallet').value.trim(),followed:el('follow-confirm').checked,liked_reposted:el('like-confirm').checked,consent:el('consent').checked,website:el('website').value})});const data=await response.json().catch(()=>({error:'Registration is unavailable right now. Your details have not been submitted.'}));if(!response.ok||data.ok!==true||!/^CR-[A-F0-9]{12}$/.test(data.application_id||''))throw new Error(data.error||'Could not save your application. Please try again.');completed=5;draw();form.hidden=true;el('success').hidden=false;el('application-id').textContent=data.application_id;el('success').scrollIntoView({behavior:'smooth',block:'center'});}catch(err){setError('submit-error',err.message||'Could not connect. Please try again.');}finally{saving=false;button.disabled=false;button.textContent='SEND MY APPLICATION \u2192';}});\nel('copy-id').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(el('application-id').textContent);el('copy-id').textContent='COPIED \u2713';}catch{el('copy-id').textContent='SELECT AND COPY THE ID ABOVE';}});\ndraw();\n<\/script><script>(() => {\n \n const Engine=window.AudioContext||window.webkitAudioContext;\n let ctx,master,loading,sources=[],wanted=true,failed=false;\n const buttons=()=>document.querySelectorAll('[data-rooftop-sound]');\n const audible=()=>wanted&&ctx?.state==='running'&&sources.length>0;\n function paint(){buttons().forEach(b=>{b.textContent=failed?'SOUND UNAVAILABLE':audible()?'\u25d6 PIGEONS \u00b7 MUTE':wanted?'\u25d6 SOUND READY \u00b7 MUTE':'\u25d6 PIGEONS \u00b7 UNMUTE';b.setAttribute('aria-pressed',String(wanted));b.setAttribute('aria-label',wanted?'Mute pigeon ambience':'Unmute pigeon ambience');b.title=audible()?'Pigeon ambience is playing':wanted?'Sound starts automatically when your browser allows it, or on your first interaction.':'Pigeon ambience is muted'})}\n function setup(){\n  if(ctx&&ctx.state!=='closed')return;\n  ctx=new Engine();master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination);ctx.onstatechange=paint;failed=false;\n  loading=Promise.all(['dove','pigeon'].map(async name=>{const r=await fetch(parent.CRUMBS_ASSETS['assets/audio/'+name+'.ogg']);if(!r.ok)throw Error('Audio unavailable');return ctx.decodeAudioData(await r.arrayBuffer())})).then(buffers=>{\n   const started=ctx.currentTime+.05;\n   [[0,.36,-.45,1,0],[1,.22,.45,1,2.2],[0,.12,.7,.94,4.1]].forEach(([index,volume,pan,rate,offset])=>{\n    const source=ctx.createBufferSource(),gain=ctx.createGain(),stereo=ctx.createStereoPanner();source.buffer=buffers[index];source.loop=true;source.playbackRate.value=rate;gain.gain.value=volume;stereo.pan.value=pan;source.connect(gain);gain.connect(stereo);stereo.connect(master);source.start(started,offset%source.buffer.duration);sources.push(source);\n   });paint();\n  }).catch(()=>{failed=true;paint()});\n }\n function attempt(){if(!wanted||!Engine)return;setup();master.gain.setTargetAtTime(.5,ctx.currentTime,.15);ctx.resume().then(paint).catch(paint);paint()}\n function mute(){wanted=false;if(ctx)master.gain.setTargetAtTime(0,ctx.currentTime,.05);paint()}\n document.addEventListener('click',e=>{if(e.target.closest('[data-rooftop-sound]')){if(wanted)mute();else{wanted=true;attempt()}}});\n function unlock(e){if(wanted&&ctx?.state!=='running'&&!e.target.closest?.('[data-rooftop-sound]'))attempt()}\n ['pointerdown','touchend','keydown','click'].forEach(type=>document.addEventListener(type,unlock,{passive:true}));\n window.addEventListener('pagehide',()=>{sources.forEach(s=>{try{s.stop()}catch{}});sources=[];ctx?.close().catch(()=>{})});\n window.addEventListener('pageshow',e=>{if(e.persisted){ctx=undefined;attempt()}});\n window.crumbsSound={refresh:paint};paint();attempt();\n})();\n<\/script></body></html>\n"};
